simulation:
  dt_fs: 0.1
  steps: 1000
  seed: 12345
  integrator: baoab
  output_stride: 10
  restart_stride: 100

force_provider:
  type: ereaxff_oracle
  v1_path: "/Users/yeatanir/PhD/PIMD/ereaxff_pimd/V1"
  v2_path: "/Users/yeatanir/PhD/PIMD/ereaxff_pimd/V2"
  ffield: "tests/T4_60el/ffield"
  geo: "geo"
  control: "tests/T4_60el/control"
  iopt: "tests/reference/iopt"

ring_polymer:
  convention: standard_ipi
  default_beads: 16
  propagator: exact

charge_coupling:
  mode: bead_local_acks2
  charge_tolerance: 1.0e-8

geometry:
  template: phase4_fixed_graphene
  electron_position_A: [7.38300, 5.68433, 10.00100]

groups:
  - name: mobile_carbons
    selector: "element == C"
    dynamics: classical
    mobile: true
    thermostat: langevin
    temperature_K: 300.0
    gamma_fs_inv: 0.001

  - name: selected_electrons
    selector: "element == El and id in [61]"
    dynamics: pimd
    beads: 16
    thermostat: pile_l
    temperature_K: 300.0
    centroid_gamma_fs_inv: 0.001

  - name: other_electrons
    selector: "element == El and id != 61"
    dynamics: frozen
    thermostat: none

output:
  centroid_xyz: true
  beads_xyz: true
  reaxff_compat: true
  diagnostics: true
